name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.21.2

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Scan tracked files and every commit message for personal data
        run: |
          uv run --frozen python -m crag.guard tracked
          uv run --frozen python -m crag.guard history
      - name: Scan full history for secrets
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt | sed 's/gitleaks_.*/gitleaks.tar.gz/' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

  test:
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: crag
          POSTGRES_PASSWORD: crag
          POSTGRES_DB: crag
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U crag"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CRAG__DATABASE__URL: postgresql://crag:crag@127.0.0.1:5433/crag
      CRAG__TEST__FASTEMBED: "1"
      CRAG__EMBEDDING__CACHE_DIR: data/models
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: data/models
          key: embedding-models-paraphrase-multilingual-MiniLM-L12-v2-${{ hashFiles('uv.lock') }}
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
